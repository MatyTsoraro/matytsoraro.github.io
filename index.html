<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090A12">
<title>PersonaAI</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"gifenc":"https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js"}}</script>
<script type="module">import * as m from 'gifenc'; window.__gifencReady=Promise.resolve(m);</script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
<script src="billing.js?v=25"></script>
<style>
:root{--bg:#090a12;--card:#151728;--card2:#1d2035;--text:#fff;--muted:#a9abc0;--pink:#ff3b9a;--purple:#7c3aed;--blue:#3478f6;--green:#20c66b;--border:#323652}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Heebo,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{width:min(100%,480px);margin:auto;padding:14px 14px 40px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-size:23px;font-weight:900;background:linear-gradient(90deg,var(--pink),#ffbd00,#5de7ff);-webkit-background-clip:text;color:transparent}
.credits{display:flex;align-items:center;gap:6px;background:#1a1d30;border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:12px}
.pro-badge{background:var(--pink);border-radius:999px;padding:2px 7px;font-size:10px;font-weight:900;display:none}
.hero{background:linear-gradient(145deg,#181229,#101422);border:1px solid var(--border);border-radius:22px;padding:14px;margin-bottom:12px}
.hero h1{font-size:21px;line-height:1.2}
.hero p{font-size:13px;color:var(--muted);margin-top:5px}
.stage{position:relative;width:100%;aspect-ratio:1/1;background:#05060a;border:1px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:0 16px 55px #0008;touch-action:none}
.stage canvas,.stage video{width:100%;height:100%;display:block;object-fit:cover}
.stage video.mirror{transform:scaleX(-1)}
.stage-badge{position:absolute;top:10px;right:10px;background:#000b;border:1px solid #ffffff2a;border-radius:999px;padding:6px 9px;font-size:11px;backdrop-filter:blur(8px)}
.capture{display:flex;gap:9px;margin:10px 0}
.btn{border:1px solid var(--border);border-radius:16px;background:var(--card2);color:#fff;padding:12px 14px;font-weight:800;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.5}
.btn-primary{border:0;background:linear-gradient(90deg,var(--pink),var(--purple))}
.btn-blue{border:0;background:linear-gradient(90deg,#2d78f6,#674bef)}
.btn-green{border:0;background:linear-gradient(90deg,#21c96d,#12a852);font-size:17px}
.btn-light{background:#fff;color:#111;border:0}
.btn-wide{width:100%}
.grow{flex:1}
.section{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:14px;margin-top:12px}
.section-title{font-size:16px;font-weight:900;margin-bottom:4px}
.section-help{font-size:12px;color:var(--muted);margin-bottom:10px}
.reaction-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.reaction{border:1px solid var(--border);background:var(--card2);color:#fff;border-radius:16px;padding:10px 4px;min-height:66px;font-size:12px;font-weight:800;cursor:pointer}
.reaction b{display:block;font-size:22px;margin-bottom:2px}
.reaction.active{border:2px solid var(--pink);background:#32172e}
.text-input{width:100%;border:1px solid var(--border);background:#0e1020;color:#fff;border-radius:15px;padding:13px 14px;outline:none;font-size:15px}
.text-input:focus{border-color:#5e8dff;box-shadow:0 0 0 3px #3478f625}
.status{display:none;margin-top:10px;padding:10px;border-radius:13px;background:#101d31;color:#8dd1ff;font-size:12px;text-align:center}
.status.show{display:block}
.result{display:none}
.result.show{display:block}
.result img{width:100%;border-radius:20px;border:1px solid var(--border);display:block;background:#05060a}
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.result-actions .btn-green{grid-column:1/-1}
.hide{display:none!important}
.progress{height:5px;background:#272b42;border-radius:99px;overflow:hidden;margin-top:8px;display:none}
.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--pink),#5de7ff);transition:width .2s}
.toast{position:fixed;z-index:100;bottom:22px;left:50%;transform:translateX(-50%);width:min(90%,420px);background:#20243a;border:1px solid var(--border);border-radius:999px;padding:10px 15px;text-align:center;font-size:12px;display:none}
.toast.error{border-color:#ff5f77;color:#ffd8df}
.legal{font-size:10px;color:#70738a;text-align:center;margin-top:18px}
</style>
</head>
<body>
<main class="app">
<header class="header"><div class="brand">PersonaAI</div><div class="credits"><span id="creditsCount">3</span> 💎<span id="proBadge" class="pro-badge">PRO</span></div></header>
<section class="hero"><h1>מה בא לכם להגיד?</h1><p>סלפי אחד ומשפט אחד - ויש לכם תגובה</p></section>
<div id="stage" class="stage"><video id="video" autoplay playsinline muted class="mirror"></video><canvas id="canvas" width="512" height="512" class="hide"></canvas><div id="stageBadge" class="stage-badge">מצלמים</div></div>
<div id="captureButtons" class="capture"><button id="shootBtn" class="btn btn-primary grow">📸 צלמו סלפי</button><button id="galleryBtn" class="btn">🖼 גלריה</button><button id="flipBtn" class="btn">🔄</button></div>
<input id="fileInput" type="file" accept="image/*" hidden>
<section id="creator" class="section hide">
<div class="section-title">רעיונות מהירים</div>
<div id="reactions" class="reaction-grid"></div>
<input id="mainInput" class="text-input" maxlength="120" placeholder="למשל: מבוהל בתחנת חלל" style="margin-top:12px">
<input id="captionInput" class="text-input" maxlength="80" placeholder="כיתוב: אין מצב 😱" style="margin-top:8px">
<button id="createBtn" class="btn btn-blue btn-wide" style="margin-top:12px;font-size:18px;padding:16px">✨ צרו GIF כמו המקור</button>
<div id="aiStatus" class="status"></div><div id="progress" class="progress"><i></i></div>
</section>
<section id="result" class="section result"><div class="section-title">מוכן 🎉</div><img id="gifPreview" alt="GIF"><div class="result-actions"><button id="shareBtn" class="btn btn-green">📲 שתפו בוואטסאפ</button><button id="saveBtn" class="btn btn-light">⬇ שמרו</button><button id="anotherBtn" class="btn">✨ עוד אחד</button></div></section>
<div class="legal">ה-GIF נוצר כמו המקור - הפנים זזות באמת</div>
</main>
<div id="toast" class="toast"></div>
<script>
const WORKER_URL='https://billowing-shape-1d81.maty-tsoraro.workers.dev';
const REACTIONS=[
{emoji:'😱',label:'מבוהל בחלל',prompt:'מבוהל בתחנת חלל',text:'אין מצב 😱',ai:'Interior of large space station command module, curved metallic walls, illuminated control panels, panoramic windows showing Earth and stars'},
{emoji:'😂',label:'מת מצחוק',prompt:'מת מצחוק באולפן קומדיה',text:'מת מצחוק 😂',ai:'Indoor television comedy studio stage, red curtains, spotlights, audience, indoors'},
{emoji:'🤯',label:'מה הולך',prompt:'המום בחדר פיקוד',text:'מה הולך פה?! 🤯',ai:'High-tech control room interior with large screens, indoors'},
{emoji:'❤️',label:'מאוהב',prompt:'מאוהב על גג בשקיעה',text:'אוהב אתכם ❤️',ai:'City rooftop at sunset, romantic lights'},
{emoji:'🎉',label:'חוגג',prompt:'חוגג במסיבה מטורפת',text:'מזל טוב! 🎉',ai:'Birthday party indoors with balloons and confetti'},
{emoji:'😴',label:'עייף',prompt:'עייף בחדר שינה מפואר',text:'אין כוח 😴',ai:'Cozy luxury bedroom at night'},
{emoji:'🙏',label:'תודה',prompt:'אומר תודה באירוע חגיגי',text:'תודה רבה 🙏',ai:'Elegant celebration hall, warm lighting'},
{emoji:'🚗',label:'בדרך',prompt:'נוהג במכונית ספורט בעיר',text:'אני בדרך 🚗',ai:'Inside futuristic sports car at night in city'},
{emoji:'✍️',label:'חופשי',prompt:'',text:'',ai:''}
];
let selectedHint='',stream=null,facing='user',sourceImage=new Image(),personCanvas=null,selfieSeg=null,segReady=false,transform={x:0,y:0,scale:1,rot:0},previewRaf=0,isBusy=false,lastGif=null;
const $=id=>document.getElementById(id);
function toast(m,e){const el=$('toast');el.textContent=m;el.className='toast'+(e?' error':'');el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',4000)}
function setMode(has){$('video').classList.toggle('hide',has);$('canvas').classList.toggle('hide',!has);$('captureButtons').classList.toggle('hide',has);$('creator').classList.toggle('hide',!has);$('stageBadge').textContent=has?'תצוגה חיה':'מצלמים'}
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:1280}},audio:false});$('video').srcObject=stream;await $('video').play()}catch{$('fileInput').click()}}
function imageCover(ctx,img,x,y,w,h){const sw=img.videoWidth||img.naturalWidth,sh=img.videoHeight||img.naturalHeight;if(!sw||!sh)return;const s=Math.max(w/sw,h/sh),dw=sw*s,dh=sh*s;ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}
function captureSource(src,mirror){const c=document.createElement('canvas');c.width=768;c.height=768;const ctx=c.getContext('2d');if(mirror){ctx.translate(c.width,0);ctx.scale(-1,1)}imageCover(ctx,src,0,0,c.width,c.height);sourceImage.onload=async()=>{transform={x:0,y:0,scale:1,rot:0};setMode(true);startPreview();await runSeg();};sourceImage.src=c.toDataURL('image/jpeg',.92)}
function drawPreview(){const ctx=$('canvas').getContext('2d');const w=512,h=512;ctx.fillStyle='#080914';ctx.fillRect(0,0,w,h);if(personCanvas){ctx.drawImage(personCanvas,0,0,w,h)}else if(sourceImage.naturalWidth){imageCover(ctx,sourceImage,0,0,w,h)}}
function startPreview(){cancelAnimationFrame(previewRaf);const loop=()=>{drawPreview();previewRaf=requestAnimationFrame(loop)};previewRaf=requestAnimationFrame(loop)}
function renderReactions(){const root=$('reactions');REACTIONS.forEach(r=>{const b=document.createElement('button');b.className='reaction';b.innerHTML=`<b>${r.emoji}</b><span>${r.label}</span>`;b.addEventListener('click',()=>{document.querySelectorAll('.reaction').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('mainInput').value=r.prompt;$('captionInput').value=r.text;selectedHint=r.ai;});root.appendChild(b)})}
async function initSeg(){if(segReady&&selfieSeg)return true;if(!window.SelfieSegmentation)return false;try{selfieSeg=new window.SelfieSegmentation({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`});selfieSeg.setOptions({modelSelection:1});segReady=true;return true}catch{return false}}
async function runSeg(){if(!sourceImage.src)return null;const ok=await initSeg();if(!ok||!selfieSeg)return null;return new Promise(async res=>{let done=false;const to=setTimeout(()=>{if(!done){done=true;res(null)}},5000);selfieSeg.onResults(r=>{if(r.segmentationMask&&!done){const w=512,h=512;const pc=document.createElement('canvas');pc.width=w;pc.height=h;const pctx=pc.getContext('2d');pctx.drawImage(sourceImage,0,0,w,h);pctx.globalCompositeOperation='destination-in';pctx.drawImage(r.segmentationMask,0,0,w,h);personCanvas=pc;done=true;clearTimeout(to);res(pc)}});try{await selfieSeg.send({image:sourceImage})}catch{clearTimeout(to);res(null)}})}
async function createOneButtonGIF(){
if(isBusy) return;
const prompt=$('mainInput').value.trim(); if(!prompt){toast('כתבו מה בא לכם - למשל מבוהל בתחנת חלל',true);return}
isBusy=true; $('createBtn').disabled=true; $('createBtn').textContent='⏳ יוצר כמו המקור...'; $('aiStatus').classList.add('show'); $('aiStatus').textContent='יוצר GIF עם פנים זזות כמו המקור שלך...'; $('progress').style.display='block'; const bar=$('progress').querySelector('i'); bar.style.width='5%';
let tx=null;
try{
if(window.PersonaBilling?.spendCreditsOrRefund){tx=window.PersonaBilling.spendCreditsOrRefund(2); if(!tx.success) throw new Error('נגמרו הקרדיטים');}
bar.style.width='15%';
const canvasTmp=document.createElement('canvas'); canvasTmp.width=768; canvasTmp.height=768; canvasTmp.getContext('2d').drawImage(sourceImage,0,0,768,768);
const imageDataUrl=canvasTmp.toDataURL('image/jpeg',0.88);
bar.style.width='25%';
let res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'generate_animated_reaction',image:imageDataUrl,prompt:prompt,promptHint:selectedHint,caption:$('captionInput').value.trim(),expression:prompt})});
let data={}; try{data=await res.json()}catch{} 
if(!res.ok) throw new Error(data.error||'שגיאת שרת');
let videoUrl=data.videoUrl||data.resultUrl;
let requestId=data.requestId;
bar.style.width='35%';
if(!videoUrl && requestId){
  $('aiStatus').textContent='מעבד וידאו... 30 שניות';
  for(let i=0;i<20;i++){
    await new Promise(r=>setTimeout(r,3000));
    bar.style.width=(35+i*2)+'%';
    try{
      const check=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'check_video',requestId:requestId})});
      const cj=await check.json();
      if(cj.videoUrl){videoUrl=cj.videoUrl; break;}
      if(cj.status==='failed') throw new Error('יצירת וידאו נכשלה');
      $('aiStatus').textContent=`מעבד... ${i*3} שניות`;
    }catch(e){ if(e.message.includes('נכשלה')) throw e; }
  }
}
if(!videoUrl) throw new Error('הוידאו עדיין בעיבוד - לחצו שוב בעוד 15 שניות, הוא יגיע');
bar.style.width='70%'; $('aiStatus').textContent='הופך ל-GIF...';
const vid=document.createElement('video'); vid.crossOrigin='anonymous'; vid.src=videoUrl; vid.muted=true; vid.loop=true; vid.playsInline=true;
await new Promise((resolve,reject)=>{const t=setTimeout(()=>resolve(),12000); vid.onloadeddata=()=>{clearTimeout(t); resolve();}; vid.onerror=()=>{clearTimeout(t); reject(new Error('שגיאת וידאו'));};});
try{await vid.play();}catch{}
bar.style.width='80%';
const {GIFEncoder,quantize,applyPalette}=await window.__gifencReady;
const enc=GIFEncoder(); const c=document.createElement('canvas'); c.width=512; c.height=512; const ctx=c.getContext('2d',{willReadFrequently:true});
const frames=18;
for(let i=0;i<frames;i++){
  try{vid.currentTime=(i/frames)*(vid.duration||3);}catch{}
  await new Promise(r=>setTimeout(r,80));
  ctx.drawImage(vid,0,0,512,512);
  const cap=$('captionInput').value.trim();
  if(cap){
    ctx.font='900 40px Heebo,Arial'; ctx.textAlign='center'; ctx.lineWidth=7; ctx.strokeStyle='#000'; ctx.fillStyle='#fff';
    ctx.strokeText(cap,256,470); ctx.fillText(cap,256,470);
  }
  const rgba=ctx.getImageData(0,0,512,512).data; const pal=quantize(rgba,96); const idx=applyPalette(rgba,pal);
  enc.writeFrame(idx,512,512,{palette:pal,delay:100,repeat:i?undefined:0});
  bar.style.width=Math.round(80+(i/frames)*20)+'%';
}
enc.finish();
if(lastGif&&lastGif.url) URL.revokeObjectURL(lastGif.url);
const blob=new Blob([enc.bytes()],{type:'image/gif'}); const url=URL.createObjectURL(blob); lastGif={blob,url};
$('gifPreview').src=url; $('result').classList.add('show'); $('result').scrollIntoView({behavior:'smooth'});
$('aiStatus').textContent='מוכן!'; bar.style.width='100%'; toast('GIF כמו המקור מוכן 🎉');
}catch(e){
if(tx&&tx.refund) tx.refund();
$('aiStatus').textContent=e.message; toast(e.message,true);
}finally{
isBusy=false; $('createBtn').disabled=false; $('createBtn').textContent='✨ צרו GIF כמו המקור';
setTimeout(()=>{$('progress').style.display='none'; $('aiStatus').classList.remove('show'); $('progress').querySelector('i').style.width='0';},3000);
}
}
function saveGif(){if(!lastGif)return;const a=document.createElement('a');a.href=lastGif.url;a.download=`PersonaAI-${Date.now()}.gif`;a.click()}
async function shareGif(){if(!lastGif)return;const file=new File([lastGif.blob],'PersonaAI.gif',{type:'image/gif'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]})}else{saveGif()}}catch{}}
$('shootBtn').addEventListener('click',()=>{if(!$('video').videoWidth){toast('מצלמה לא מוכנה',true);return}captureSource($('video'),facing==='user');if(stream)stream.getTracks().forEach(t=>t.stop())});
$('galleryBtn').addEventListener('click',()=>$('fileInput').click());
$('fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>captureSource(im,false);im.src=r.result};r.readAsDataURL(f);e.target.value=''});
$('flipBtn').addEventListener('click',()=>{facing=facing==='user'?'environment':'user';$('video').classList.toggle('mirror',facing==='user');startCamera()});
$('createBtn').addEventListener('click',createOneButtonGIF);
$('saveBtn').addEventListener('click',saveGif);$('shareBtn').addEventListener('click',shareGif);
$('anotherBtn').addEventListener('click',()=>{$('result').classList.remove('show');window.scrollTo({top:$('creator').offsetTop-10,behavior:'smooth'})});
$('mainInput').addEventListener('input',()=>{selectedHint='';});
renderReactions();
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}
if('caches' in window){caches.keys().then(keys=>keys.forEach(k=>caches.delete(k)));}
startCamera();
try{const c=window.PersonaBilling?.getCredits?.()??3;$('creditsCount').textContent=c;const isPro=window.PersonaBilling?.isPro?.();$('proBadge').style.display=isPro?'inline-block':'none'}catch{}
</script>
</body>
</html>
