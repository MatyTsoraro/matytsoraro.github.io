<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viral Avatar Studio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #00f3ff; --secondary: #bc13fe; --bg: #0a0a12; --panel: rgba(22, 22, 37, 0.8); --text: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Glass Panel Design from Lovable */
        .glass-panel { background: var(--panel); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(14px); border-radius: 24px; }
        
        header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        h1 { font-size: 1.5rem; background: linear-gradient(45deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
        
        .container { flex: 1; display: flex; flex-direction: column; padding: 15px; gap: 15px; overflow-y: auto; max-width: 500px; margin: 0 auto; width: 100%; }
        .container::-webkit-scrollbar { display: none; }
        
        .viewport { height: 40vh; min-height: 250px; border-radius: 24px; overflow: hidden; position: relative; border: 2px solid rgba(255,255,255,0.1); }
        video, img, canvas { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        img, canvas { display: none; z-index: 2; }
        
        .loading-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: 10; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .controls { display: flex; justify-content: space-around; padding: 10px 0; }
        .icon-btn { background: var(--panel); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; width: 50px; height: 50px; font-size: 1.2rem; cursor: pointer; }
        #captureBtn { background: linear-gradient(45deg, var(--primary), var(--secondary)); width: 70px; height: 70px; font-size: 2rem; border: none; }
        
        #styleMenu, #resultMenu { display: none; flex-direction: column; gap: 15px; padding-bottom: 20px;}
        
        /* 3 Column Grid Design */
        .category-title { font-size: 0.85rem; color: #aaa; margin-bottom: 8px; padding-right: 5px; }
        .style-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .style-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 15px 5px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: white; cursor: pointer; }
        .style-card i { font-size: 1.8rem; color: var(--primary); }
        .style-card span { font-size: 0.75rem; font-weight: bold; text-align: center; }
        
        .faceoff-btn { background: linear-gradient(45deg, #ff0055, #00f3ff); border: none; border-radius: 20px; padding: 15px; color: white; font-weight: bold; font-size: 1.1rem; display: flex; justify-content: center; gap: 10px; cursor: pointer; width: 100%; margin-top: 10px;}
        
        .action-btn { width: 100%; padding: 15px; border-radius: 15px; border: none; font-weight: bold; font-size: 1rem; color: white; cursor: pointer; display: flex; justify-content: center; gap: 10px; margin-bottom: 10px;}
        .btn-wa { background: #25D366; }
        .btn-dl { background: var(--primary); color: black; }
        
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ff3366; padding: 10px 20px; border-radius: 20px; display: none; z-index: 100; font-weight: bold; }
    </style>
</head>
<body>

    <header class="glass-panel">
        <div style="color: #ffb800; font-weight: bold;"><i class="fas fa-bolt"></i> <span id="creditCount">3</span>/3</div>
        <h1>VIRAL AVATAR</h1>
        <div style="width: 40px;"></div>
    </header>

    <div class="container">
        <div class="viewport glass-panel">
            <video id="videoElement" autoplay playsinline muted></video>
            <canvas id="canvasElement"></canvas>
            <img id="resultImage" alt="Result">
            <!-- נגן מיוחד לוידאו שחוזר מ-FaceOff -->
            <video id="resultVideo" style="display:none;" controls autoplay playsinline loop></video>
            
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <div style="color: var(--primary); font-weight: bold;" id="loadingText">מעבד קסם...</div>
            </div>
        </div>

        <div id="cameraMenu">
            <div class="controls">
                <button class="icon-btn" onclick="document.getElementById('uploadInput').click()"><i class="fas fa-upload"></i></button>
                <input type="file" id="uploadInput" accept="image/*" style="display:none">
                <button id="captureBtn" onclick="takePhoto()"><i class="fas fa-camera"></i></button>
                <button class="icon-btn" onclick="switchCamera()"><i class="fas fa-sync"></i></button>
            </div>
        </div>

        <div id="styleMenu">
            <button class="faceoff-btn" onclick="generateFaceOff()">
                <i class="fas fa-video"></i> FACE OFF - וידאו טיקטוק
            </button>
            
            <div>
                <div class="category-title">תבניות פרימיום</div>
                <div class="style-grid">
                    <div class="style-card" onclick="generateImage('tech_ceo')"><i class="fas fa-briefcase"></i><span>מנכ"ל הייטק</span></div>
                    <div class="style-card" onclick="generateImage('cyber_ninja')"><i class="fas fa-user-ninja"></i><span>סייבר-נינג'ה</span></div>
                    <div class="style-card" onclick="generateImage('jedi_master')"><i class="fab fa-jedi-order"></i><span>אביר ג'דיי</span></div>
                </div>
            </div>
        </div>

        <div id="resultMenu">
            <button class="action-btn btn-wa" onclick="shareResult()"><i class="fab fa-whatsapp"></i> שתף בוואטסאפ</button>
            <button class="action-btn btn-dl" onclick="downloadResult()"><i class="fas fa-download"></i> שמור למכשיר</button>
            <button class="action-btn glass-panel" onclick="resetApp()"><i class="fas fa-camera"></i> צלם מחדש</button>
        </div>
    </div>

    <div id="toast"></div>

<script>
    const API_URL = "https://billowing-shape-1d81.maty-tsoraro.workers.dev";
    let stream = null;
    let facingMode = 'user';
    let base64Image = null;
    let currentResultUrl = null;

    const videoEl = document.getElementById('videoElement');
    const canvasEl = document.getElementById('canvasElement');
    const imgEl = document.getElementById('resultImage');
    const resVideoEl = document.getElementById('resultVideo');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');

    // אתחול מצלמה
    async function startCamera() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode } });
            videoEl.srcObject = stream;
        } catch (e) { showToast("שגיאה בגישה למצלמה"); }
    }
    
    function switchCamera() { facingMode = facingMode === 'user' ? 'environment' : 'user'; startCamera(); }

    function takePhoto() {
        canvasEl.width = videoEl.videoWidth; canvasEl.height = videoEl.videoHeight;
        const ctx = canvasEl.getContext('2d');
        if (facingMode === 'user') { ctx.translate(canvasEl.width, 0); ctx.scale(-1, 1); }
        ctx.drawImage(videoEl, 0, 0);
        base64Image = canvasEl.toDataURL('image/jpeg', 0.8);
        showStyleMenu();
    }

    document.getElementById('uploadInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                canvasEl.width = img.width; canvasEl.height = img.height;
                canvasEl.getContext('2d').drawImage(img, 0, 0);
                base64Image = canvasEl.toDataURL('image/jpeg', 0.8);
                showStyleMenu();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function showStyleMenu() {
        imgEl.src = base64Image;
        imgEl.style.display = 'block';
        videoEl.style.display = 'none';
        document.getElementById('cameraMenu').style.display = 'none';
        document.getElementById('styleMenu').style.display = 'flex';
    }

    // יצירת תמונה (Sync)
    async function generateImage(style) {
        if (!checkCredits()) return;
        setLoading(true, "מייצר תמונה (כ-20 שניות)...");
        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "image", image: base64Image, style: style })
            });
            const data = await res.json();
            if(data.error) throw new Error(data.error);
            showResult(data.resultUrl, 'image');
            deductCredit();
        } catch (e) {
            showToast(e.message);
            setLoading(false);
        }
    }

    // יצירת וידאו (Async Polling לפי Lovable)
    async function generateFaceOff() {
        if (!checkCredits()) return;
        setLoading(true, "מתחיל החלפת פנים בוידאו...");
        try {
            // 1. בקשת התחלה
            const startRes = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "faceoff", image: base64Image })
            });
            const startData = await startRes.json();
            if(startData.error) throw new Error(startData.error);
            if(!startData.id) throw new Error("לא התקבל מזהה משימה");

            // 2. תור המתנה (Polling)
            let isDone = false;
            let attempts = 0;
            while (!isDone && attempts < 40) { // מקסימום כ-2.5 דקות
                await new Promise(r => setTimeout(r, 4000));
                attempts++;
                loadingText.innerText = "מעבד וידאו... אנא המתן (" + attempts + ")";
                
                const pollRes = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: "status", id: startData.id })
                });
                const pollData = await pollRes.json();
                
                if (pollData.status === "succeeded" && pollData.output) {
                    showResult(pollData.output, 'video');
                    deductCredit();
                    isDone = true;
                } else if (pollData.status === "failed") {
                    throw new Error(pollData.error || "הוידאו נכשל בשרת");
                }
            }
            if(!isDone) throw new Error("זמן ההמתנה לוידאו עבר. השרת עמוס.");

        } catch (e) {
            showToast(e.message);
            setLoading(false);
        }
    }

    function showResult(url, type) {
        currentResultUrl = url;
        setLoading(false);
        document.getElementById('styleMenu').style.display = 'none';
        
        if (type === 'video') {
            imgEl.style.display = 'none';
            resVideoEl.src = url;
            resVideoEl.style.display = 'block';
        } else {
            resVideoEl.style.display = 'none';
            imgEl.src = url;
            imgEl.style.display = 'block';
        }
        document.getElementById('resultMenu').style.display = 'flex';
    }

    function resetApp() {
        document.getElementById('resultMenu').style.display = 'none';
        document.getElementById('styleMenu').style.display = 'none';
        imgEl.style.display = 'none';
        resVideoEl.style.display = 'none';
        resVideoEl.pause();
        videoEl.style.display = 'block';
        document.getElementById('cameraMenu').style.display = 'block';
        base64Image = null;
    }

    function setLoading(isLoading, text) {
        loadingText.innerText = text;
        loadingOverlay.style.display = isLoading ? 'flex' : 'none';
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 4000);
    }

    // Credits & Monetag Logic
    let credits = 3;
    function checkCredits() {
        if (credits > 0) return true;
        // סימולציה לפתיחת פרסומת Monetag כדי לקבל קרדיט
        window.open('https://omg10.com/4/11571722', '_blank');
        credits = 1; 
        document.getElementById('creditCount').innerText = credits;
        showToast("צפית בפרסומת! קיבלת קרדיט נוסף.");
        return false;
    }
    function deductCredit() {
        credits--;
        document.getElementById('creditCount').innerText = credits;
    }

    function downloadResult() {
        if(!currentResultUrl) return;
        const a = document.createElement('a');
        a.href = currentResultUrl;
        a.download = "ViralAvatar";
        a.click();
    }
    async function shareResult() {
        if(!currentResultUrl) return;
        try {
            await navigator.share({ title: 'Viral Avatar', url: currentResultUrl });
        } catch(e) { showToast("השיתוף לא נתמך במכשיר זה"); }
    }

    startCamera();
</script>
</body>
</html>
