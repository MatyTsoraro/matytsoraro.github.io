<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PersonaAI - GIF Studio Pro</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161b26;
      --accent-color: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #2d3748;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }

    body {
      background-color: var(--bg-color); color: var(--text-main);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 16px;
    }

    header {
      width: 100%; max-width: 600px; display: flex; justify-content: space-between;
      align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem; font-weight: 800; background: var(--accent-gradient);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .credits-btn {
      background: var(--card-bg); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 8px 16px; border-radius: 20px;
      font-weight: 600; cursor: pointer;
    }

    .main-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }
    
    .card {
      background-color: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px;
    }

    .fx-step { font-size: 0.95rem; color: var(--text-muted); }
    .fx-step b { color: var(--accent-color); }

    .preview-container {
      position: relative; width: 100%; height: 380px; background: #000;
      border-radius: 12px; overflow: hidden; display: flex;
      justify-content: center; align-items: center; border: 1px solid var(--border-color);
    }

    canvas { max-width: 100%; max-height: 100%; object-fit: contain; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }

    .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .option-btn {
      background: #1f293d; border: 1px solid var(--border-color); color: var(--text-main);
      padding: 10px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; text-align: center;
      transition: all 0.2s;
    }
    .option-btn.active { background: var(--accent-color); border-color: var(--accent-color); font-weight: bold; }

    .primary-btn {
      background: var(--accent-gradient); color: white; border: none; padding: 14px;
      border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer;
      width: 100%; text-align: center; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .result-box { display: none; flex-direction: column; gap: 12px; align-items: center; }
    .result-box.show { display: flex; }
    .result-box img { max-width: 100%; border-radius: 12px; border: 1px solid var(--border-color); }

    .progress-bar { display: none; font-size: 0.9rem; color: var(--accent-color); text-align: center; font-weight: bold; }
    .progress-bar.show { display: block; }
  </style>
</head>
<body>

  <header>
    <h1>PersonaAI GIF Studio</h1>
    <button id="creditsBtn" class="credits-btn">5 💎</button>
  </header>

  <div class="main-container">
    
    <!-- Upload Section -->
    <div class="card" id="uploadCard">
      <div class="fx-step"><b>1</b> העלו תמונת סלפי ברורה</div>
      <input type="file" id="imageInput" accept="image/*" style="display: none;">
      <button class="primary-btn" onclick="$('imageInput').click()">בחרו תמונה מהמכשיר 📸</button>
    </div>

    <!-- Studio Section -->
    <div class="card" id="studioCard" style="display: none;">
      <div class="fx-step"><b>2</b> גררו את האפקטים עם האצבע וצרו GIF ויראלי</div>
      
      <div class="preview-container" id="fxPreview">
        <canvas id="fxCanvas" width="480" height="600"></canvas>
      </div>

      <label class="fx-step">אביזרים מיוחדים:</label>
      <div class="options-grid" id="fxListGrid"></div>

      <label class="fx-step">הבעת פנים:</label>
      <div class="options-grid" id="faceListGrid"></div>

      <label class="fx-step">תפאורת רקע:</label>
      <div class="options-grid" id="sceneListGrid"></div>

      <div id="fxProgress" class="progress-bar">מכין GIF... 0%</div>

      <button id="createGifBtn" class="primary-btn" onclick="createAnimatedGif()">צור GIF מושלם לווטסאפ ✨</button>
    </div>

    <!-- Result Section -->
    <div class="card result-box" id="resultCard">
      <div class="fx-step"><b>3</b> ה-GIF מוכן! מתנגן אוטומטית בווטסאפ 🔥</div>
      <img id="resultImage" alt="Generated GIF">
      <button class="primary-btn" onclick="shareGif()">שתפו לווטסאפ 🚀</button>
    </div>

  </div>

  <script>
    const $ = id => document.getElementById(id);

    // הגדרות ומשתנים
    let sourceImageObj = null;
    let faceBox = { x: 100, y: 100, w: 280, h: 280 };
    let selectedEffects = ['glasses'];
    let selectedFaceMotion = 'none';
    let selectedScene = 'none';
    let gifQuality = 'standard';
    let gifBlobResult = null;
    let animId = null;

    const FACE_LIST = [
      ['none', '🙂 רגיל'], ['blink', '😉 מצמוץ'], ['smile', '😊 חיוך'],
      ['sad', '😢 עצוב'], ['angry', '😡 עצבני']
    ];

    const FX_LIST = [
      ['glasses', '🕶️ משקפיים'], ['thug', '😎 Thug Life'], ['lazers', '🔴 לייזרים'],
      ['crown', '👑 כתר'], ['sparkles', '✨ ניצוצות'], ['coffee', '☕ קפה']
    ];

    const SCENE_LIST = [
      ['none', 'ללא תפאורה'], ['fire', '🔥 אש וגיהנום'], ['matrix', '💻 מטריקס'],
      ['disco', '🪩 מסיבה']
    ];

    // יצירת התפריט
    function buildUI() {
      const renderGrid = (gridId, list, type) => {
        const grid = $(gridId);
        grid.innerHTML = '';
        list.forEach(([id, label]) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          if (type === 'fx' && selectedEffects.includes(id)) btn.classList.add('active');
          if (type === 'face' && selectedFaceMotion === id) btn.classList.add('active');
          if (type === 'scene' && selectedScene === id) btn.classList.add('active');
          
          btn.textContent = label;
          btn.onclick = () => {
            if (type === 'fx') {
              if (selectedEffects.includes(id)) selectedEffects = selectedEffects.filter(x => x !== id);
              else selectedEffects.push(id);
            } else if (type === 'face') selectedFaceMotion = id;
            else if (type === 'scene') selectedScene = id;
            buildUI();
          };
          grid.appendChild(btn);
        });
      };
      renderGrid('fxListGrid', FX_LIST, 'fx');
      renderGrid('faceListGrid', FACE_LIST, 'face');
      renderGrid('sceneListGrid', SCENE_LIST, 'scene');
    }

    // קריאת תמונה מהמשתמש
    $('imageInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          sourceImageObj = img;
          faceBox = { x: img.width * 0.25, y: img.height * 0.2, w: img.width * 0.5, h: img.height * 0.5 };
          $('studioCard').style.display = 'flex';
          startLivePreview();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    // ==========================================
    // מערכת גרירה (Drag & Drop)
    // ==========================================
    const fxCanvas = $('fxCanvas');
    let isDragging = false, dragStartX = 0, dragStartY = 0;
    let initialFxOffset = { x: 0, y: 0 };
    let fxOffset = { x: 0, y: 0 };

    function getPointerPos(e) {
      if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    function handleDragStart(e) {
      isDragging = true;
      const pos = getPointerPos(e);
      dragStartX = pos.x; dragStartY = pos.y;
      initialFxOffset = { ...fxOffset };
      if(e.cancelable) e.preventDefault();
    }

    function handleDragMove(e) {
      if (!isDragging) return;
      const pos = getPointerPos(e);
      // מכפיל 1.5 מזרז את התנועה ומעניק תחושה טבעית
      fxOffset = { 
        x: initialFxOffset.x + (pos.x - dragStartX) * 1.5, 
        y: initialFxOffset.y + (pos.y - dragStartY) * 1.5 
      };
    }

    function handleDragEnd() { isDragging = false; }

    fxCanvas.addEventListener('mousedown', handleDragStart);
    window.addEventListener('mousemove', handleDragMove);
    window.addEventListener('mouseup', handleDragEnd);
    fxCanvas.addEventListener('touchstart', handleDragStart, { passive: false });
    window.addEventListener('touchmove', handleDragMove, { passive: false });
    window.addEventListener('touchend', handleDragEnd);

    // ==========================================
    // פונקציות הציור של האפקטים (תומך Offset)
    // ==========================================
    function drawScene(ctx, t, w, h) {
      if (selectedScene === 'none') return;
      
      if (selectedScene === 'fire') {
        ctx.fillStyle = 'rgba(40, 5, 0, 0.4)';
        ctx.fillRect(0, 0, w, h);
        ctx.globalCompositeOperation = 'screen';
        for (let i = 0; i < 40; i++) {
          const pX = (i * 73) % w;
          const speed = 1 + (i % 3);
          const pY = h + 50 - (((t * h * speed) + (i * 20)) % (h + 100));
          const size = 15 + (i % 20);
          const grad = ctx.createRadialGradient(pX, pY, 0, pX, pY, size);
          grad.addColorStop(0, 'rgba(255, 200, 0, 0.8)');
          grad.addColorStop(0.4, 'rgba(255, 50, 0, 0.5)');
          grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(pX, pY, size, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
      }
      else if (selectedScene === 'matrix') {
        ctx.fillStyle = 'rgba(0, 15, 0, 0.5)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#0f0';
        ctx.font = '900 16px monospace';
        for (let i = 0; i < 25; i++) {
          const x = i * (w / 25);
          const y = (((t * h * 1.5) + (i * 80)) % h);
          ctx.fillText(Math.random() > 0.5 ? '1' : '0', x, y);
          ctx.fillStyle = 'rgba(0, 255, 0, 0.4)';
          ctx.fillText(Math.random() > 0.5 ? '1' : '0', x, y - 16);
          ctx.fillStyle = '#0f0';
        }
      }
      else if (selectedScene === 'disco') {
        const r = Math.floor(127 + 128 * Math.sin(t * Math.PI * 8));
        const g = Math.floor(127 + 128 * Math.sin(t * Math.PI * 8 + 2));
        const b = Math.floor(127 + 128 * Math.sin(t * Math.PI * 8 + 4));
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.25)`;
        ctx.fillRect(0, 0, w, h);
        
        ctx.fillStyle = '#eee';
        ctx.beginPath(); ctx.arc(w / 2, 30, 25, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, 5); ctx.stroke();
      }
    }

    function drawFaceMotion(ctx, f, t) {
      if (selectedFaceMotion === 'none') return;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      const fx = f.x + fxOffset.x;
      const fy = f.y + fxOffset.y;
      
      const ey = fy + f.h * 0.39;
      const my = fy + f.h * 0.75;
      const mw = f.w * 0.2;
      
      if (selectedFaceMotion === 'blink') {
        const q = Math.pow(Math.max(0, Math.sin((t - 0.15) * Math.PI * 4)), 10);
        if (q > 0.05) {
          ctx.strokeStyle = 'rgba(30,20,25,0.88)'; ctx.lineWidth = Math.max(3, f.w * 0.025);
          ctx.beginPath(); ctx.moveTo(fx + f.w * 0.18, ey); ctx.quadraticCurveTo(fx + f.w * 0.29, ey + f.h * 0.06 * q, fx + f.w * 0.4, ey); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(fx + f.w * 0.6, ey); ctx.quadraticCurveTo(fx + f.w * 0.71, ey + f.h * 0.06 * q, fx + f.w * 0.82, ey); ctx.stroke();
        }
      } 
      else if (selectedFaceMotion === 'smile') {
        const q = (1 - Math.cos(t * Math.PI * 2)) / 2;
        ctx.strokeStyle = 'rgba(90,20,35,0.85)'; ctx.lineWidth = Math.max(3, f.w * 0.02);
        ctx.beginPath(); ctx.moveTo(fx + f.w * 0.5 - mw, my);
        ctx.quadraticCurveTo(fx + f.w * 0.5, my + (f.h * 0.1 * q), fx + f.w * 0.5 + mw, my); ctx.stroke();
      }
      else if (selectedFaceMotion === 'sad') {
        const q = (1 - Math.cos(t * Math.PI * 2)) / 2;
        ctx.strokeStyle = 'rgba(45,30,30,0.8)'; ctx.lineWidth = Math.max(3, f.w * 0.02);
        const by = fy + f.h * 0.28;
        ctx.beginPath(); ctx.moveTo(fx + f.w * 0.2, by + f.h * 0.03); ctx.lineTo(fx + f.w * 0.4, by - f.h * 0.02 * q); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(fx + f.w * 0.8, by + f.h * 0.03); ctx.lineTo(fx + f.w * 0.6, by - f.h * 0.02 * q); ctx.stroke();
        ctx.strokeStyle = 'rgba(90,20,35,0.85)';
        ctx.beginPath(); ctx.moveTo(fx + f.w * 0.5 - mw, my);
        ctx.quadraticCurveTo(fx + f.w * 0.5, my - (f.h * 0.08 * q), fx + f.w * 0.5 + mw, my); ctx.stroke();
        
        const tearY = ey + (t * f.h * 0.6);
        const tearOpacity = t < 0.8 ? 1 : (1 - t) * 5;
        ctx.fillStyle = `rgba(100, 200, 255, ${tearOpacity * 0.8})`;
        ctx.beginPath(); ctx.arc(fx + f.w * 0.25, tearY, f.w * 0.03, 0, Math.PI * 2); ctx.fill();
      }
      else if (selectedFaceMotion === 'angry') {
        const q = (1 - Math.cos(t * Math.PI * 2)) / 2;
        ctx.strokeStyle = 'rgba(45,20,20,0.9)'; ctx.lineWidth = Math.max(4, f.w * 0.025);
        const by = fy + f.h * 0.25;
        ctx.beginPath(); ctx.moveTo(fx + f.w * 0.15, by - f.h * 0.02); ctx.lineTo(fx + f.w * 0.4, by + f.h * 0.04 * q); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(fx + f.w * 0.85, by - f.h * 0.02); ctx.lineTo(fx + f.w * 0.6, by + f.h * 0.04 * q); ctx.stroke();
        const grad = ctx.createRadialGradient(fx + f.w*0.5, by, 0, fx + f.w*0.5, by, f.w*0.4);
        grad.addColorStop(0, `rgba(255, 0, 0, ${q * 0.2})`);
        grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
        ctx.fillStyle = grad; ctx.fillRect(fx, fy, f.w, f.h * 0.5);
      }
      ctx.restore();
    }

    // ציור האביזרים המיוחדים
    function drawGlasses(ctx, f, t) {
      const ex = f.x + fxOffset.x;
      const ey = f.y + f.h * 0.35 + fxOffset.y + Math.sin(t*Math.PI*2)*5;
      ctx.fillStyle = 'rgba(10,10,10,0.9)';
      ctx.beginPath(); ctx.roundRect(ex + f.w*0.1, ey, f.w*0.35, f.h*0.2, 10); ctx.fill();
      ctx.beginPath(); ctx.roundRect(ex + f.w*0.55, ey, f.w*0.35, f.h*0.2, 10); ctx.fill();
      ctx.fillRect(ex + f.w*0.45, ey + f.h*0.05, f.w*0.1, f.h*0.05);
    }

    function drawThugLife(ctx, f, t) {
      const dropY = -150 * (1 - Math.min(1, t / 0.5)); 
      const x = f.x + fxOffset.x, y = f.y + f.h * 0.35 + dropY + fxOffset.y;
      const w = f.w, h = f.h * 0.18, pw = w * 0.06;
      ctx.fillStyle = '#050505';
      for (let i = 0; i < 7; i++) {
        ctx.fillRect(x + w*0.1 + (i*pw), y + (i<4 ? i*pw : (7-i)*pw), pw*2, h*0.8);
        ctx.fillRect(x + w*0.6 + (i*pw), y + (i<4 ? i*pw : (7-i)*pw), pw*2, h*0.8);
      }
      ctx.fillRect(x + w*0.4, y + pw, w*0.2, pw*2);
    }

    function drawLazers(ctx, f, t) {
      const pulse = 0.7 + 0.3 * Math.sin(t * Math.PI * 12);
      const s1 = f.x + f.w * 0.25 + fxOffset.x, s2 = f.x + f.w * 0.75 + fxOffset.x;
      const sy = f.y + f.h * 0.38 + fxOffset.y;
      ctx.save();
      ctx.strokeStyle = `rgba(255, 20, 20, ${pulse})`; ctx.lineWidth = f.w * 0.1;
      ctx.shadowColor = 'red'; ctx.shadowBlur = 25; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s1, sy); ctx.lineTo(s1 - 800, sy + 1000); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s2, sy); ctx.lineTo(s2 + 800, sy + 1000); ctx.stroke();
      ctx.strokeStyle = 'white'; ctx.lineWidth = f.w * 0.03; ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.moveTo(s1, sy); ctx.lineTo(s1 - 800, sy + 1000); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s2, sy); ctx.lineTo(s2 + 800, sy + 1000); ctx.stroke();
      ctx.restore();
    }

    function drawCrown(ctx, f, t) {
      const cx = f.x + f.w/2 + fxOffset.x, cy = f.y - f.h*0.1 + fxOffset.y;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.sin(t*Math.PI*2)*0.1);
      ctx.fillStyle = 'gold';
      ctx.beginPath(); ctx.moveTo(-f.w*0.3, 0); ctx.lineTo(-f.w*0.4, -f.w*0.3); ctx.lineTo(-f.w*0.15, -f.w*0.15); 
      ctx.lineTo(0, -f.w*0.4); ctx.lineTo(f.w*0.15, -f.w*0.15); ctx.lineTo(f.w*0.4, -f.w*0.3); ctx.lineTo(f.w*0.3, 0); ctx.fill();
      ctx.restore();
    }

    function drawSparkles(ctx, f, t) {
      const cx = f.x + f.w/2 + fxOffset.x, cy = f.y + f.h/2 + fxOffset.y;
      for(let i=0; i<6; i++) {
        const angle = t * Math.PI * 2 + (i * Math.PI * 2 / 6);
        const px = cx + Math.cos(angle) * f.w * 0.6;
        const py = cy + Math.sin(angle) * f.w * 0.6;
        ctx.fillStyle = (i%2===0) ? '#ffea00' : '#ffffff';
        ctx.beginPath(); ctx.arc(px, py, 4 + Math.sin(t*Math.PI*10)*3, 0, Math.PI*2); ctx.fill();
      }
    }

    function drawCoffee(ctx, f, t) {
       const cx = f.x + f.w*0.8 + fxOffset.x, cy = f.y + f.h*0.8 + fxOffset.y;
       ctx.fillStyle = '#fff'; ctx.fillRect(cx, cy, f.w*0.2, f.h*0.25);
       ctx.strokeStyle = '#fff'; ctx.lineWidth=4; ctx.strokeRect(cx+f.w*0.2, cy+f.h*0.05, f.w*0.08, f.h*0.1);
       ctx.fillStyle = 'rgba(255,255,255,0.4)';
       ctx.beginPath(); ctx.arc(cx+f.w*0.1, cy - (t*f.h*0.3), f.w*0.05, 0, Math.PI*2); ctx.fill();
    }

    function drawFxFrame(ctx, img, f, t, w, h) {
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      
      drawScene(ctx, t, w, h);
      drawFaceMotion(ctx, f, t);
      
      for (const effect of selectedEffects) {
        if (effect === 'glasses') drawGlasses(ctx, f, t);
        else if (effect === 'thug') drawThugLife(ctx, f, t);
        else if (effect === 'lazers') drawLazers(ctx, f, t);
        else if (effect === 'crown') drawCrown(ctx, f, t);
        else if (effect === 'sparkles') drawSparkles(ctx, f, t);
        else if (effect === 'coffee') drawCoffee(ctx, f, t);
      }
    }

    function startLivePreview() {
      const ctx = fxCanvas.getContext('2d');
      let startTime = performance.now();
      const loop = (now) => {
        if (!sourceImageObj) return;
        const t = ((now - startTime) % 2000) / 2000;
        drawFxFrame(ctx, sourceImageObj, faceBox, t, fxCanvas.width, fxCanvas.height);
        animId = requestAnimationFrame(loop);
      };
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(loop);
    }

    // ==========================================
    // יצירת ה-GIF באמצעות Web Worker (Auto-play מושלם)
    // ==========================================
    async function createAnimatedGif() {
      if (!sourceImageObj) return;
      $('fxProgress').classList.add('show');$('fxProgress').textContent = 'מכין פריימים... 0%';
      $('createGifBtn').disabled = true;

      // רזולוציה אופטימלית ומשקל נמוך
      const w = 400, h = 500, frames = 25, delay = 80;
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = w; tempCanvas.height = h;
      const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });

      const framesData = [];
      for (let i = 0; i < frames; i++) {
        drawFxFrame(tempCtx, sourceImageObj, faceBox, i / frames, w, h);
        framesData.push(tempCtx.getImageData(0, 0, w, h).data);
      }

      const workerCode = `
        import { GIFEncoder, quantize, applyPalette } from "https://cdn.jsdelivr.net/npm/gifenc@1.0.3/+esm";
        self.onmessage = async (e) => {
          const { frames, w, h, delay } = e.data;
          const gif = GIFEncoder();
          for (let i = 0; i < frames.length; i++) {
            const rgba = frames[i];
            // 128 צבעים במקום 256 מבטיח משקל נמוך לניגון אוטומטי
            const palette = quantize(rgba, 128);
            const index = applyPalette(rgba, palette);
            gif.writeFrame(index, w, h, { palette, delay, repeat: i === 0 ? 0 : undefined });
            self.postMessage({ percent: Math.round(((i + 1) / frames.length) * 100) });
          }
          gif.finish();
          const buffer = gif.bytes().buffer;
          self.postMessage({ buffer }, [buffer]);
        };
      `;

      const blob = new Blob([workerCode], { type: 'application/javascript' });
      const workerUrl = URL.createObjectURL(blob);
      const worker = new Worker(workerUrl, { type: 'module' });

      gifBlobResult = await new Promise((resolve, reject) => {
        worker.onmessage = (e) => {
          if (e.data.percent) {
            $('fxProgress').textContent = `מקודד GIF... ${e.data.percent}%`;
          } else if (e.data.buffer) {
            resolve(new Blob([e.data.buffer], { type: 'image/gif' }));
            worker.terminate();
            URL.revokeObjectURL(workerUrl);
          }
        };
        worker.onerror = reject;
        worker.postMessage({ frames: framesData, w, h, delay });
      });

      if (window.gifObjectUrl) URL.revokeObjectURL(window.gifObjectUrl);
      window.gifObjectUrl = URL.createObjectURL(gifBlobResult);
      
      $('resultImage').src = window.gifObjectUrl;
      $('resultCard').classList.add('show');
      $('fxProgress').classList.remove('show');$('createGifBtn').disabled = false;
      $('resultCard').scrollIntoView({ behavior: 'smooth' });
    }

    // ==========================================
    // מערכת שיתוף Native ל-WhatsApp
    // ==========================================
    async function shareGif() {
      if (!gifBlobResult) return;
      const file = new File([gifBlobResult], "persona-meme.gif", { type: "image/gif" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ 
            files: [file], 
            title: 'PersonaAI GIF', 
            text: 'נוצר באפליקציית PersonaAI ✨' 
          });
        } catch (err) { console.log('Share canceled', err); }
      } else {
        alert('המכשיר אינו תומך בשיתוף קבצים ישיר.');
      }
    }

    buildUI();
  </script>
