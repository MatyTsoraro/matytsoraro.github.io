<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PersonaAI - Viral Avatar Studio</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF3366">
    <link rel="icon" type="image/png" href="PersonaAI_Icon_512x512.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;500;800&display=swap');
        body { 
            font-family: 'Heebo', sans-serif; 
            background-color: #030207; 
            color: white; 
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(22, 22, 37, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .pro-btn {
            background: linear-gradient(45deg, #FF3366, #ffb800);
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
            color: white;
            font-weight: bold;
        }
        .tiktok-btn {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
            color: white;
            font-weight: bold;
        }
        #cameraView {
            transform: scaleX(-1);
            object-fit: cover;
        }
        .loader-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00f3ff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-20">

    <!-- Header -->
    <header class="w-full flex justify-between items-center p-4 glass-panel sticky top-0 z-50">
        <div class="text-2xl font-black tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-[#00f3ff] to-[#FF3366]">
            VIRAL AVATAR
        </div>
        <div class="flex items-center gap-2 bg-white/10 px-4 py-1.5 rounded-full border border-white/20">
            <span id="creditCount" class="font-bold text-[#ffb800]">3/3</span>
            <i class="fas fa-bolt text-[#ffb800]"></i>
        </div>
    </header>

    <!-- Camera Section -->
    <main class="w-full max-w-md mt-6 px-4 flex flex-col items-center">
        <div class="relative w-full aspect-[3/4] bg-gray-900 rounded-3xl overflow-hidden shadow-2xl border-2 border-white/10">
            <video id="cameraView" autoplay playsinline class="w-full h-full"></video>
            <canvas id="snapshotCanvas" class="hidden"></canvas>
            <img id="previewImage" class="hidden w-full h-full object-cover" />
            
            <div id="cameraControls" class="absolute bottom-6 left-0 w-full flex justify-center gap-6 px-4">
                <button onclick="switchCamera()" class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-white shadow-lg active:scale-95 transition">
                    <i class="fas fa-sync-alt"></i>
                </button>
                
                <button onclick="takeSnapshot()" class="w-20 h-20 rounded-full bg-gradient-to-r from-[#00f3ff] to-[#FF3366] p-1 shadow-[0_0_20px_rgba(0,243,255,0.4)] active:scale-90 transition">
                    <div class="w-full h-full bg-black rounded-full border-4 border-white flex items-center justify-center">
                        <i class="fas fa-camera text-2xl text-white"></i>
                    </div>
                </button>
                
                <button onclick="document.getElementById('fileInput').click()" class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-white shadow-lg active:scale-95 transition">
                    <i class="fas fa-upload"></i>
                </button>
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
            </div>
            
            <button id="retakeBtn" onclick="resetCamera()" class="hidden absolute top-4 right-4 glass-panel px-4 py-2 rounded-full text-sm font-bold shadow-lg">
                <i class="fas fa-times mr-2"></i> צלם מחדש
            </button>
        </div>

        <!-- Styles Section -->
        <div id="stylesSection" class="w-full mt-8 hidden flex-col gap-4">
            <h3 class="text-xl font-bold text-center text-white/90">בחר סגנון ויראלי</h3>
            
            <div class="grid grid-cols-2 gap-3">
                <button onclick="applyStyle('cyberpunk')" class="glass-panel py-3 rounded-2xl font-bold active:scale-95 transition">
                    <i class="fas fa-robot text-[#00f3ff] block mb-1 text-2xl"></i> סייברפאנק
                </button>
                <button onclick="applyStyle('fantasy')" class="glass-panel py-3 rounded-2xl font-bold active:scale-95 transition">
                    <i class="fas fa-dragon text-purple-400 block mb-1 text-2xl"></i> פנטזיה
                </button>
                <button onclick="applyStyle('gta')" class="glass-panel py-3 rounded-2xl font-bold active:scale-95 transition">
                    <i class="fas fa-car text-yellow-400 block mb-1 text-2xl"></i> GTA Style
                </button>
                <button onclick="applyStyle('anime')" class="glass-panel py-3 rounded-2xl font-bold active:scale-95 transition">
                    <i class="fas fa-star text-pink-400 block mb-1 text-2xl"></i> אנימה
                </button>
            </div>

            <!-- PRO Styles -->
            <div class="mt-4 border-t border-white/10 pt-4 flex flex-col gap-3">
                <button onclick="applyStyle('linkedin_4k')" class="pro-btn py-4 rounded-2xl text-lg flex items-center justify-center gap-2 active:scale-95 transition">
                    <i class="fas fa-briefcase"></i> תמונת לינקדאין (PRO) 4K
                </button>
                <button onclick="applyStyle('cinematic_video')" class="pro-btn py-4 rounded-2xl text-lg flex items-center justify-center gap-2 active:scale-95 transition">
                    <i class="fas fa-film"></i> צילום קולנועי (PRO) 4K
                </button>
                <button onclick="applyStyle('tiktok_video')" class="tiktok-btn py-4 rounded-2xl text-lg flex items-center justify-center gap-2 active:scale-95 transition">
                    <i class="fab fa-tiktok"></i> וידאו טיקטוק ויראלי (PRO)
                </button>
            </div>

            <!-- Free Text Creation -->
            <div class="mt-4 glass-panel p-4 rounded-2xl flex flex-col gap-3">
                <div class="flex gap-2">
                    <input type="text" id="customPrompt" placeholder="תאר מה תרצה להיות..." class="w-full bg-black/50 text-white px-4 py-3 rounded-xl border border-white/10 focus:outline-none focus:border-[#00f3ff]">
                    <button id="micBtn" class="bg-white/10 px-4 rounded-xl text-white active:bg-white/20">
                        <i class="fas fa-microphone"></i>
                    </button>
                </div>
                <button id="customBtn" class="w-full bg-white text-black font-bold py-3 rounded-xl active:scale-95 transition shadow-lg">
                    צור יצירת מופת <i class="fas fa-magic ml-2"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Monetag Ad Modal -->
    <div id="adModal" class="fixed inset-0 bg-black/90 z-50 hidden flex-col items-center justify-center p-6 backdrop-blur-sm">
        <div class="glass-panel p-8 rounded-3xl text-center max-w-sm w-full border border-[#FF3366]/30">
            <i class="fas fa-battery-empty text-5xl text-[#FF3366] mb-4"></i>
            <h2 class="text-2xl font-black mb-2">נגמרו לך הקרדיטים!</h2>
            <p class="text-white/70 mb-6">רוצה ליצור עוד אווטארים ויראליים? צפה בפרסומת קצרה וקבל תמונה נוספת בחינם!</p>
            
            <a href="https://omg10.com/4/11571722" target="_blank" onclick="handleAdClick()" class="w-full block bg-gradient-to-r from-[#00f3ff] to-[#4facfe] text-black font-black py-4 rounded-xl mb-3 shadow-[0_0_15px_rgba(0,243,255,0.4)]">
                צפה בפרסומת וקבל תמונה
            </a>
            
            <button onclick="closeModal('adModal')" class="w-full bg-white/10 text-white font-bold py-3 rounded-xl">
                ביטול
            </button>
        </div>
    </div>

    <!-- Loading Modal -->
    <div id="loadingModal" class="fixed inset-0 bg-black/95 z-50 hidden flex-col items-center justify-center p-6">
        <div class="loader-spinner mb-6"></div>
        <h2 class="text-2xl font-black mb-2 text-center text-[#00f3ff] animate-pulse">מייצר קסם ויראלי...</h2>
        <p class="text-white/60 text-center text-sm max-w-xs">הבינה המלאכותית מנתחת את הפנים שלך. תהליך וידאו יכול לקחת עד 3-4 דקות. נא להמתין!</p>
        <div id="errorMsg" class="mt-6 text-[#FF3366] font-bold text-center hidden bg-red-900/30 p-3 rounded-xl"></div>
        <button id="closeErrorBtn" onclick="closeModal('loadingModal'); resetCamera();" class="hidden mt-4 bg-white text-black px-6 py-2 rounded-full font-bold">חזור למצלמה</button>
    </div>

    <!-- Result Modal -->
    <div id="resultModal" class="fixed inset-0 bg-black z-50 hidden flex-col items-center justify-start pt-10 px-4 overflow-y-auto">
        <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#00f3ff] to-[#FF3366] mb-6">התוצאה שלך!</h2>
        
        <div id="resultContainer" class="w-full max-w-sm rounded-2xl overflow-hidden shadow-[0_0_30px_rgba(255,51,102,0.3)] mb-6">
            <!-- Image or Video will be injected here -->
        </div>

        <div class="flex w-full max-w-sm gap-3 pb-10">
            <button id="downloadBtn" class="flex-1 bg-gradient-to-r from-[#00f3ff] to-[#4facfe] text-black font-black py-4 rounded-xl shadow-lg active:scale-95 transition flex items-center justify-center gap-2">
                <i class="fas fa-download"></i> שמור לטלפון
            </button>
            <button onclick="closeModal('resultModal'); resetCamera();" class="w-16 bg-white/10 text-white py-4 rounded-xl active:scale-95 transition flex items-center justify-center">
                <i class="fas fa-home text-xl"></i>
            </button>
        </div>
    </div>

    <script>
        let video = document.getElementById('cameraView');
        let currentStream = null;
        let facingMode = 'user';
        let capturedImageB64 = null;
        let credits = 3;
        const maxCredits = 3;
        
        // הקישור החדש והמעודכן לשרת האמיתי שלך ב-Cloudflare!
        const WORKER_URL = 'https://billowing-shape-1d81.maty-tsoraro.workers.dev';

        async function setupCamera() {
            if (currentStream) currentStream.getTracks().forEach(track => track.stop());
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = currentStream;
            } catch (err) {
                console.error("Camera error:", err);
            }
        }

        function switchCamera() {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            video.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
            setupCamera();
        }

        function takeSnapshot() {
            const canvas = document.getElementById('snapshotCanvas');
            const preview = document.getElementById('previewImage');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            if (facingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            capturedImageB64 = canvas.toDataURL('image/jpeg', 0.8);
            preview.src = capturedImageB64;
            
            video.classList.add('hidden');
            preview.classList.remove('hidden');
            document.getElementById('cameraControls').classList.add('hidden');
            document.getElementById('retakeBtn').classList.remove('hidden');
            document.getElementById('stylesSection').classList.remove('hidden');
            document.getElementById('stylesSection').classList.add('flex');
            
            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
        }

        function resetCamera() {
            document.getElementById('previewImage').classList.add('hidden');
            video.classList.remove('hidden');
            document.getElementById('cameraControls').classList.remove('hidden');
            document.getElementById('retakeBtn').classList.add('hidden');
            document.getElementById('stylesSection').classList.add('hidden');
            document.getElementById('stylesSection').classList.remove('flex');
            capturedImageB64 = null;
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                capturedImageB64 = e.target.result;
                const preview = document.getElementById('previewImage');
                preview.src = capturedImageB64;
                video.classList.add('hidden');
                preview.classList.remove('hidden');
                document.getElementById('cameraControls').classList.add('hidden');
                document.getElementById('retakeBtn').classList.remove('hidden');
                document.getElementById('stylesSection').classList.remove('hidden');
                document.getElementById('stylesSection').classList.add('flex');
            };
            reader.readAsDataURL(file);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'he-IL';
            recognition.interimResults = false;

            document.getElementById('micBtn').addEventListener('click', () => {
                recognition.start();
                document.getElementById('micBtn').classList.add('bg-red-500');
            });

            recognition.onresult = (event) => {
                document.getElementById('customPrompt').value = event.results[0][0].transcript;
                document.getElementById('micBtn').classList.remove('bg-red-500');
            };
            recognition.onerror = () => {
                document.getElementById('micBtn').classList.remove('bg-red-500');
            };
        } else {
            document.getElementById('micBtn').style.display = 'none';
        }

        async function translateToEnglish(text) {
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=he&tl=en&dt=t&q=${encodeURI(text)}`);
                const data = await res.json();
                return data[0][0][0];
            } catch (e) {
                return text;
            }
        }

        function updateCreditDisplay() {
            document.getElementById('creditCount').innerText = `${credits}/${maxCredits}`;
            if (credits <= 0) {
                document.getElementById('adModal').classList.remove('hidden');
                document.getElementById('adModal').classList.add('flex');
            }
        }

        function canGenerate() {
            if (credits <= 0) {
                document.getElementById('adModal').classList.remove('hidden');
                document.getElementById('adModal').classList.add('flex');
                return false;
            }
            return true;
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        }

        function handleAdClick() {
            setTimeout(() => {
                credits = maxCredits;
                updateCreditDisplay();
                closeModal('adModal');
            }, 3000);
        }

        window.applyStyle = function(styleName) {
            if (!canGenerate()) return;
            credits--;
            updateCreditDisplay();
            callAPI({ image: capturedImageB64, style: styleName });
        };

        document.getElementById('customBtn').addEventListener('click', async () => {
            const prompt = document.getElementById('customPrompt').value;
            if (!prompt) return;
            if (!canGenerate()) return;
            
            credits--;
            updateCreditDisplay();
            
            const engPrompt = await translateToEnglish(prompt);
            callAPI({ image: capturedImageB64, style: engPrompt });
        });

        async function callAPI(requestBody) {
            const loading = document.getElementById('loadingModal');
            const errorMsg = document.getElementById('errorMsg');
            const closeErrorBtn = document.getElementById('closeErrorBtn');
            
            loading.classList.remove('hidden');
            loading.classList.add('flex');
            errorMsg.classList.add('hidden');
            closeErrorBtn.classList.add('hidden');
            errorMsg.innerText = "";

            try {
                let res;
                try {
                    res = await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });
                } catch (networkErr) {
                    throw new Error("שגיאת תקשורת עם השרת (Cloudflare). ודא שלחצת Deploy ושאין חוסם פרסומות מופעל.");
                }
                
                const startData = await res.json();
                
                if (startData.error) throw new Error("השרת החזיר שגיאה: " + startData.error);
                if (startData.detail) throw new Error("שגיאת Replicate: " + JSON.stringify(startData.detail));
                if (!startData.id) throw new Error("שגיאה: לא התקבל מזהה משימה מהשרת. כנראה שהסרטון video1.mp4 לא תקין.");

                let predictionId = startData.id;
                let status = startData.status;
                let attempts = 0;
                const MAX_ATTEMPTS = 120; // הארכנו ל-6 דקות (120 ניסיונות של 3 שניות)

                while (status === "starting" || status === "processing") {
                    attempts++;
                    if (attempts > MAX_ATTEMPTS) {
                        throw new Error("השרת עמוס מדי כרגע. החזרנו לך את הקרדיט.");
                    }
                    
                    await new Promise(r => setTimeout(r, 3000));
                    
                    let pollRes;
                    try {
                        pollRes = await fetch(WORKER_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: "status", id: predictionId })
                        });
                    } catch (netErr) {
                        continue; 
                    }
                    
                    const pollData = await pollRes.json();
                    if (pollData.error) throw new Error(pollData.error);
                    
                    status = pollData.status;
                    
                    if (status === "succeeded") {
                        showResult(pollData.output, requestBody.style === 'tiktok_video');
                        return;
                    } else if (status === "failed") {
                        throw new Error("היצירה נכשלה בשרת. יומן: " + (pollData.logs || "No logs"));
                    }
                }
            } catch (err) {
                console.error(err);
                credits++; 
                updateCreditDisplay();
                errorMsg.innerText = err.message;
                errorMsg.classList.remove('hidden');
                closeErrorBtn.classList.remove('hidden');
            }
        }

        function showResult(outputUrl, isVideo) {
            closeModal('loadingModal');
            const resultContainer = document.getElementById('resultContainer');
            resultContainer.innerHTML = '';
            
            let finalUrl = Array.isArray(outputUrl) ? outputUrl[0] : outputUrl;

            if (isVideo) {
                resultContainer.innerHTML = `<video src="${finalUrl}" autoplay loop muted playsinline class="w-full h-auto rounded-2xl border border-[#00f3ff] shadow-[0_0_15px_rgba(0,243,255,0.4)]"></video>`;
            } else {
                resultContainer.innerHTML = `<img src="${finalUrl}" class="w-full h-auto rounded-2xl border border-[#00f3ff] shadow-[0_0_15px_rgba(0,243,255,0.4)]" />`;
            }

            const downloadBtn = document.getElementById('downloadBtn');
            downloadBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = finalUrl;
                a.download = isVideo ? "Viral_Avatar.mp4" : "Viral_Avatar.png";
                a.target = "_blank";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            const resultModal = document.getElementById('resultModal');
            resultModal.classList.remove('hidden');
            resultModal.classList.add('flex');
        }

        window.addEventListener('load', setupCamera);
    </script>
</body>
</html>
